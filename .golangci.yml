version: "2"

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
  exclusions:
    generated: strict
    rules:
      # gosec's G101 flags test-fixture strings that merely look like
      # credentials; errcheck flags every unchecked httptest.Server
      # response Write/Close, which this codebase (like most Go code)
      # doesn't treat as a real error path in tests; bodyclose can't
      # always prove http.Client.Do leaves res nil on error, and flags
      # the resulting "err != nil, so nothing to close" branch of a
      # negative test as an unclosed body.
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - bodyclose

formatters:
  enable:
    - gofmt

run:
  timeout: 5m
