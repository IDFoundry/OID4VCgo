# Docker Compose override pinning the OIDF conformance suite's own
# server image to a known-good digest, overriding the suite's own
# docker-compose-prebuilt.yml default of ${IMAGE_TAG:-latest}. nginx
# deliberately stays unpinned — it's a thin TLS-terminating reverse
# proxy with essentially no compatibility surface with the server
# app's own internal behavior, so tracking :latest for it is safe (and
# simpler than sourcing a nginx digest that's actually still valid on
# the registry — an earlier version of this file pinned nginx too, to
# a digest that turned out to already be garbage-collected/invalid by
# the time CI tried to pull it: "manifest unknown", confirmed via a
# direct `docker manifest inspect` query, not a local-cache artifact).
#
# Why (original finding, 2026-09-24): :latest regressed. Confirmed live
# by force-pulling a fresh :latest (digest sha256:59ae129254dfd056389d2
# ada3af766c6241879877048d13886a04c9e213dddb8) and bringing up a suite
# from it — every oid4vp-1final-verifier-* module now gets INTERRUPTED
# milliseconds after creation, before this repo's own driving code ever
# gets a chance to respond to anything. The suite's own container log
# names the cause directly, on its own side, not ours:
#
#   ERROR ... Caught an error in 'TestRunner.java background task'
#   while running the test, stopping the test: Condition
#   'DumpRicalCborDiagnostics'/'ValidateRicalSignature'/'ParseRical'
#   called when test status is 'INTERRUPTED'. This is a bug in the
#   test module and probably means that a call to
#   setStatus(Status.RUNNING) is missing.
#
# That's the suite's own newly-added "Rical"-related condition calling
# into a test module before it reaches RUNNING — a bug in the suite's
# own TestRunner/TestDispatcher sequencing, not in anything this repo
# controls. That day's pinned digest (sha256:4d2c9047708be25113f54425c0
# fd75a0a8805b6ec70506c563ce8fd9a81fba88, since superseded — see below)
# was pulled and verified working — full local
# conformance/scripts/run-oid4vp.sh runs, cold and warm — before the
# regression was found.
#
# Update (2026-09-25): that pinned digest itself was garbage-collected
# from the registry by this date ("manifest unknown", confirmed via a
# direct `docker manifest inspect` query against the real registry, not
# local cache) — CI failed immediately unable to even pull it. Before
# re-pinning, checked whether upstream had fixed the Rical bug in the
# meantime by force-pulling a fresh :latest again: it hadn't — the same
# bug still reproduces, now surfacing under a wider set of Rical-named
# conditions than the original finding
# (ValidateRicalSignerCertificate/ValidateRicalSignature/
# ValidateRicalStructure/DumpRicalCborDiagnostics/RegisterVical, all
# "called when test status is 'INTERRUPTED'"). Re-pinned below to the
# release-v5.3.1 tag's own digest instead of another :latest snapshot —
# verified live (Verifier sd_jwt_vc + mdoc, both cold and warm) with no
# Rical/INTERRUPTED errors in the suite's own container logs. A named
# release tag is presumably less likely to be garbage-collected out
# from under this pin than an anonymous point-in-time :latest digest,
# but that's not guaranteed either — this file still needs the same
# periodic re-verification regardless of which tag a pinned digest came
# from.
#
# Remove this file (and the `-f` flag referencing it in both
# .github/workflows/oid4vci-conformance.yml and
# oid4vp-conformance.yml's own "Bring up OIDF conformance suite" step)
# once upstream fixes this and a fresh :latest has been verified
# working again — see this repo's own memory record for the
# fix-verification checklist.
services:
  server:
    image: registry.gitlab.com/openid/conformance-suite@sha256:69495f453a920c262f66e5e72abd12501c33e05ce88051cddf300c00621a4d70
