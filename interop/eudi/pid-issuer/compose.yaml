# The EUDI reference PID Issuer's own docker-compose stack
# (eudi-srv-pid-issuer's docker-compose/docker-compose.yaml, at the tag
# run-pid-issuer.sh pins), reproduced for interop/eudi/run-pid-issuer.sh:
# every image pinned by digest, every key, certificate and password
# made for the run, HAProxy alone published, on loopback, and TLS
# verified everywhere the issuer's own stack verifies nothing (its
# `insecure` profile is off). The script sets every variable.
name: ${COMPOSE_PROJECT_NAME:?}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    environment:
      POSTGRES_DB: pid_issuer
      POSTGRES_USER: pid_issuer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - ${STACK:?}/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pid_issuer -d pid_issuer"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: ${KEYCLOAK_IMAGE:?}
    command: [start-dev, --import-realm, "--features=dpop,passkeys"]
    environment:
      KC_PROXY_HEADERS: forwarded
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
      KC_HOSTNAME: https://localhost:${PORT:?}/idp
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTPS_CERTIFICATE_FILE: /etc/oid4vcgo/keycloak-cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /etc/oid4vcgo/keycloak-key.pem
      # Keycloak fetches the Wallet Provider's status list from serve,
      # whose certificate is under the run's TLS CA.
      KC_TRUSTSTORE_PATHS: /etc/oid4vcgo/tls-ca.pem
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${STACK:?}/realms:/opt/keycloak/data/import:ro
      - ${STACK:?}/keycloak.conf:/opt/keycloak/conf/keycloak.conf:ro
      - ${STACK:?}/abca-keycloak-ext.jar:/opt/keycloak/providers/abca-keycloak-ext.jar:ro
      - ${STACK:?}/keycloak-tls:/etc/oid4vcgo:ro
    healthcheck:
      test: ["CMD-SHELL", "{ printf 'HEAD /idp/health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  status-list:
    build:
      context: ${STACK:?}/status-list
      # status-list.Dockerfile, which the script copies in: compose
      # builds only from a Dockerfile inside the context.
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?}
    image: ${COMPOSE_PROJECT_NAME:?}-status-list
    environment:
      API_key: ${STATUS_LIST_API_KEY:?}
    volumes:
      - ${STACK:?}/config_service.py:/status-list/app/config_service.py:ro
      - ${STACK:?}/status-list-certs:/status-list/certs:ro

  pid-issuer:
    image: ${PID_ISSUER_IMAGE:?}
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
      status-list:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${STACK:?}/issuer-keys.p12:/issuer-keys.p12:ro
      # The image's ca-certificates buildpack adds each certificate in
      # a binding of that type to the JVM's trust store: the run's TLS
      # CA, under which Keycloak's and serve's certificates are.
      - ${STACK:?}/bindings:/bindings:ro
    environment:
      SERVICE_BINDING_ROOT: /bindings
      JAVA_TOOL_OPTIONS: -XX:MaxDirectMemorySize=128M
      SPRING_WEBFLUX_BASE_PATH: /pid-issuer
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID: pid-issuer-srv
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET: ${INTROSPECTION_SECRET:?}
      SPRING_HTTP_CODECS_MAXINMEMORYSIZE: 8MB
      ISSUER_PUBLICURL: https://localhost:${PORT:?}/pid-issuer
      ISSUER_AUTHORIZATIONSERVER_PUBLICURL: https://localhost:${PORT:?}/idp/realms/pid-issuer-realm
      ISSUER_AUTHORIZATIONSERVER_INTROSPECTION: https://keycloak:8443/idp/realms/pid-issuer-realm/protocol/openid-connect/token/introspect
      ISSUER_KEYSTORE_FILE: file:/issuer-keys.p12
      ISSUER_KEYSTORE_TYPE: PKCS12
      ISSUER_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_ALIAS: request-encryption
      ISSUER_CREDENTIALREQUESTENCRYPTION_JWKS_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_NONCE_ENCRYPTIONKEY_ALIAS: nonce-encryption
      ISSUER_NONCE_ENCRYPTIONKEY_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_PID_MSO_MDOC_SIGNING_KEY_ALIAS: pid-mdoc
      ISSUER_PID_MSO_MDOC_SIGNING_KEY_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_PID_SD_JWT_VC_SIGNING_KEY_ALIAS: pid-sdjwt
      ISSUER_PID_SD_JWT_VC_SIGNING_KEY_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_MDL_SIGNING_KEY_ALIAS: pid-mdoc
      ISSUER_MDL_SIGNING_KEY_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_ALIAS: pid-sdjwt
      ISSUER_LEARNINGCREDENTIAL_SIGNING_KEY_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_ACCESSCERTIFICATE_ALIAS: access-certificate
      ISSUER_ACCESSCERTIFICATE_PASSWORD: ${KEYSTORE_PASSWORD:?}
      ISSUER_KEYCLOAK_SERVER_URL: https://keycloak:8443/idp
      ISSUER_KEYCLOAK_AUTHENTICATION_REALM: master
      ISSUER_KEYCLOAK_CLIENT_ID: admin-cli
      ISSUER_KEYCLOAK_USERNAME: admin
      ISSUER_KEYCLOAK_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      ISSUER_KEYCLOAK_USER_REALM: pid-issuer-realm
      ISSUER_DPOP_REALM: pid-issuer
      SPRING_R2DBC_URL: r2dbc:pool:postgresql://postgres:5432/pid_issuer
      SPRING_R2DBC_USERNAME: pid_issuer
      SPRING_R2DBC_PASSWORD: ${DB_PASSWORD:?}
      ISSUER_STATUSLIST_SERVICE_GENERATE_URI: http://status-list:5000/token_status_list/take
      ISSUER_STATUSLIST_SERVICE_REVOKE_URI: http://status-list:5000/token_status_list/set
      ISSUER_STATUSLIST_SERVICE_APIKEY: ${STATUS_LIST_API_KEY:?}
      # The issuer allocates a status list entry only under a Credential
      # Reuse Policy (allocateStatusWithPolicy): without one, the stack's
      # default, its PIDs carry no status. once_only, for both formats.
      ISSUER_PID_MSO_MDOC_REUSEPOLICY_ENABLED: "true"
      ISSUER_PID_MSO_MDOC_REUSEPOLICY_OPTIONS_0_DETAILS: once_only
      ISSUER_PID_MSO_MDOC_REUSEPOLICY_OPTIONS_0_BATCHSIZE: "3"
      ISSUER_PID_MSO_MDOC_REUSEPOLICY_OPTIONS_0_REISSUETRIGGERUNUSED: "1"
      ISSUER_PID_SD_JWT_VC_REUSEPOLICY_ENABLED: "true"
      ISSUER_PID_SD_JWT_VC_REUSEPOLICY_OPTIONS_0_DETAILS: once_only
      ISSUER_PID_SD_JWT_VC_REUSEPOLICY_OPTIONS_0_BATCHSIZE: "3"
      ISSUER_PID_SD_JWT_VC_REUSEPOLICY_OPTIONS_0_REISSUETRIGGERUNUSED: "1"
      ISSUER_METADATA_DISPLAY_0_NAME: OID4VCgo interop PID Issuer
      ISSUER_METADATA_DISPLAY_0_LOCALE: en
      ISSUER_WRPRC: ${WRPRC:?}

  haproxy:
    image: ${HAPROXY_IMAGE:?}
    # HAProxy sizes its file descriptors from its maxconn, which EUDI's
    # haproxy.conf leaves at the default, and refuses to start when it
    # can't raise its limit to that (100035): a GitHub runner's
    # containers start with 65536.
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    ports:
      - 127.0.0.1:${PORT:?}:443
    depends_on:
      keycloak:
        condition: service_healthy
      pid-issuer:
        condition: service_started
      status-list:
        condition: service_started
    volumes:
      - ${STACK:?}/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${STACK:?}/haproxy-tls:/etc/ssl/certs:ro
