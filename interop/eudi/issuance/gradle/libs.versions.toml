# Every version pinned exactly: see build.gradle.kts for the locks and
# checksums that go with them.
[versions]
kotlin = "2.4.20"
# The wallet under test, and EUDI's SD-JWT VC verifier.
openid4vci = "0.16.0"
sdjwt = "0.21.0"
ktor = "3.6.0"
bouncycastle = "1.85"
cbor = "0.9"
slf4j = "2.0.17"

[libraries]
eudi-openid4vci = { module = "eu.europa.ec.eudi:eudi-lib-jvm-openid4vci-kt", version.ref = "openid4vci" }
eudi-sdjwt = { module = "eu.europa.ec.eudi:eudi-lib-jvm-sdjwt-kt", version.ref = "sdjwt" }
ktor-client-java = { module = "io.ktor:ktor-client-java", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
cbor = { module = "co.nstant.in:cbor", version.ref = "cbor" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
