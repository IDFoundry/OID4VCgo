version: 2
updates:
  # The Go modules: this one, mobile/ (golang.org/x/mobile, for
  # gomobile), sqlstore/ (database drivers, for its tests) and
  # examples/passport-vdc. The other three use this one through a
  # replace, so a dependency they share must move in all of them at
  # once, or CI's go mod tidy check fails: one pull request per
  # dependency, across the directories that use it.
  - package-ecosystem: gomod
    directories:
      - /
      - /mobile
      - /sqlstore
      - /examples/passport-vdc
    schedule:
      interval: weekly
    groups:
      go-modules:
        group-by: dependency-name
        patterns:
          - "*"
    ignore:
      # Pinned by hand after reading each release: a FAPIgo release with
      # breaking or security changes is a fix(deps)! with a migration
      # note (AGENTS.md), not a chore.
      - dependency-name: github.com/idfoundry/fapigo

  # Keeps the pinned actions/checkout, actions/setup-go,
  # actions/upload-artifact, golang/govulncheck-action,
  # golangci/golangci-lint-action and googleapis/release-please-action
  # versions across ci.yml, oid4vci-conformance.yml,
  # oid4vp-conformance.yml, fuzz.yml and release-please.yml current —
  # the one other real dependency surface this repo has.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # The conformance harnesses' base images (conformance/*/Dockerfile),
  # pinned by digest: kept current here.
  - package-ecosystem: docker
    directories:
      - /conformance/issuer
      - /conformance/verifier
      - /conformance/wallet-vp
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns:
          - "*"
    ignore:
      # Digest updates only: the harnesses build with the Go line go.mod
      # and CI use, and move to the next one with them, in the same PR.
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
