name: govulncheck

# Scans each Go module for known vulnerabilities under the Go version its
# go.mod declares: the oldest Go anyone may build it with, so the version
# every finding matters for. The mobile module's standard library is
# compiled into the Swift and Kotlin packages, so it's scanned too, as are
# sqlstore and examples/passport-vdc. A standard-library finding is fixed
# by raising the go directive in every go.mod to a release that has the
# fix; that a newer Go is already fixed says nothing about what these
# modules let their users build with, so this deliberately doesn't scan
# under the latest release. A finding in a dependency is fixed by upgrading it.
#
# Runs on every pull request and push to main (as the required
# "govulncheck" check, one job so the name stays that), and daily,
# because an advisory is often published while nothing changes here: the
# scheduled run is what turns red first. Mirrors FAPIgo's
# .github/workflows/govulncheck.yml.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 5 * * *' # daily, 5:30am UTC: after FAPIgo's 5am run, before the 6am conformance runs
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Exactly each go.mod's version, not the newest patch release that
      # satisfies it: check-latest stays off. go-version-input defaults
      # to "stable", which setup-go would prefer over go-version-file,
      # so it's cleared.
      - name: root module
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: go.mod
          check-latest: false

      - name: mobile
        if: ${{ !cancelled() }}
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: mobile/go.mod
          check-latest: false
          cache-dependency-path: mobile/go.sum
          work-dir: mobile

      - name: sqlstore
        if: ${{ !cancelled() }}
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: sqlstore/go.mod
          check-latest: false
          cache-dependency-path: sqlstore/go.sum
          work-dir: sqlstore

      - name: examples/passport-vdc
        if: ${{ !cancelled() }}
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          repo-checkout: false
          go-version-input: ''
          go-version-file: examples/passport-vdc/go.mod
          check-latest: false
          cache-dependency-path: examples/passport-vdc/go.sum
          work-dir: examples/passport-vdc
