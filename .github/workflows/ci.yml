name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, not the default shallow clone — SonarQube's own
          # recommendation, for accurate blame/new-code-period data on
          # the scan step below.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -coverpkg=./..., not the bare default: Go's default coverage
      # only credits a package for lines exercised by its OWN _test.go
      # files, not lines exercised indirectly through another
      # package's tests — which was making several genuinely
      # well-tested packages (internal/certchain in particular: 97.1%
      # real coverage via issuer/verifier/wallet's own test suites)
      # report as 0% to Sonar. Found while exploring what would
      # meaningfully raise the reported coverage number after fixing
      # the Sonar integration itself.
      - name: go test (race)
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # A second run, in Go's own -json event format rather than
      # coverage.out, purely for SonarQube's test-execution reporting
      # (pass/fail/skip counts and duration — see
      # sonar.go.tests.reportPaths in sonar-project.properties) — a
      # distinct signal from coverage, which the step above already
      # covers. Not folded into one invocation: `go test -json` encodes
      # the ordinary human-readable output (including the per-package
      # coverage summary above) as JSON events instead, which would
      # make this job's own log far harder to skim.
      # A pull request from a fork gets no repository secrets, so no
      # SONAR_TOKEN: the scan would fail "Not authorized" and fail this
      # job though every test passed. Check for the token here — only
      # this step and the scan see it, not the steps running the PR's
      # code — and skip both Sonar steps without it.
      - name: SonarQube token available?
        id: sonar
        run: echo "available=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: go test (json, for SonarQube test reporting)
        if: steps.sonar.outputs.available == 'true'
        run: go test -race ./... -json > report.json

      # Config lives in sonar-project.properties (organization,
      # projectKey, sonar.go.coverage.reportPaths=coverage.out — the
      # file the step above just produced). CI-based analysis, not
      # SonarCloud's own Automatic Analysis — the latter never runs
      # this repo's tests, so it can't see coverage at all; that's the
      # whole reason this step exists.
      - name: SonarQube Scan
        if: steps.sonar.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # Config lives in .golangci.yml — gosec (security), bodyclose,
      # plus golangci-lint's own "standard" set (errcheck, staticcheck,
      # govet, ineffassign, unused, gosimple). gofmt is enforced
      # separately above, not duplicated here.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12

  # examples/passport-vdc is its own Go module (it depends on gmrtd,
  # which the library must not), so the root jobs' ./... never reaches
  # it — without this job the demo would silently stop building. Its
  # real-passport verification path is skipped here: that needs a
  # synthetic test passport gmrtd doesn't provide yet (see
  # examples/passport-vdc/README.md).
  examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/passport-vdc
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: examples/passport-vdc/go.mod
          check-latest: true
          cache-dependency-path: examples/passport-vdc/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: examples/passport-vdc

  # mobile/ is its own Go module too: the gomobile boundary (see
  # mobile/MOBILE.md), which needs golang.org/x/mobile.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/go.mod
          check-latest: true
          cache-dependency-path: mobile/go.sum

      - name: go vet
        run: go vet ./...

      # With the mobiletest tag too: the end-to-end session tests drive
      # the in-process test issuer (TestEnv) only that build has.
      - name: go test (race)
        run: go test -race ./... && go test -race -tags mobiletest ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
          working-directory: mobile
          args: --build-tags mobiletest

  # Builds the XCFramework with gomobile and runs the Swift package's
  # tests against its macOS slice: issuance and presentation end to end
  # against an in-process test issuer and Verifier, Go calling back into
  # the Swift key store, credential store and Wallet Provider, errors and
  # cancellation across the boundary.
  mobile-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/go.mod
          check-latest: true
          cache-dependency-path: mobile/go.sum

      - name: build the XCFramework (test build)
        run: mobile/build-xcframework.sh -tags mobiletest

      - name: swift test
        working-directory: mobile/ios/OID4VCWallet
        env:
          OID4VC_TEST_FRAMEWORK: "1"
        run: swift test

      # The demo wallet app links the shipping build, without TestEnv.
      - name: build the XCFramework (release build)
        run: mobile/build-xcframework.sh

      - name: build the demo wallet app
        working-directory: mobile/ios/DemoWallet
        run: xcodebuild build -project DemoWallet.xcodeproj -scheme DemoWallet -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet

      # The package's DocC documentation, failing on any DocC warning,
      # with its articles' examples compiled against the package, and
      # laid out for GitHub Pages as the release workflow publishes it.
      - name: check the documentation
        run: |
          DOCC_OUTPUT="$RUNNER_TEMP/OID4VCWallet.doccarchive" mobile/ios/check-docs.sh
          mobile/ios/docs-site.sh 0.0.0-ci "$RUNNER_TEMP/OID4VCWallet.doccarchive" "$RUNNER_TEMP/docs"

      # The package as wallet-swift-release.yml publishes it, built
      # against the zipped release framework.
      - name: lay out the published Swift package
        env:
          SKIP_FRAMEWORK_BUILD: "1"
        run: mkdir -p "$RUNNER_TEMP/pkg" && mobile/ios/package-swift-release.sh 0.0.0-ci "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/assets"

  # Builds the AAR with gomobile and runs the Kotlin library's
  # instrumented tests against it on an emulator: Go has no slice that
  # runs on the host JVM, unlike the XCFramework's macOS one.
  mobile-android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/go.mod
          check-latest: true
          cache-dependency-path: mobile/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: build the AAR (test build)
        run: mobile/build-aar.sh -tags mobiletest

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: instrumented tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile/android
          # A PIN, and the emulator unlocked with it: holder keys need a
          # secure lock screen, and every key needs the device unlocked.
          script: |
            ./unlock-emulator.sh
            ./gradlew --console=plain :OID4VCWallet:connectedDebugAndroidTest -Poid4vc.testFramework=true

      - name: the failing instrumented tests
        if: failure()
        run: |
          for f in mobile/android/OID4VCWallet/build/outputs/androidTest-results/connected/debug/*.xml; do
            python3 -c 'import sys, xml.etree.ElementTree as E
          for c in E.parse(sys.argv[1]).iter("testcase"):
              for f in c.findall("failure"): print("::error::%s.%s: %s" % (c.get("classname"), c.get("name"), (f.text or "").splitlines()[0][:400]))' "$f"
          done

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-results
          path: mobile/android/OID4VCWallet/build/outputs/androidTest-results/

      # What an app ships: the release build, without TestEnv.
      - name: build the AAR (release build)
        run: mobile/build-aar.sh

      - name: build the library (release), its host tests, and the demo wallet app
        working-directory: mobile/android
        run: |
          ./gradlew --console=plain :OID4VCWallet:assembleRelease :OID4VCWallet:testDebugUnitTest :DemoWallet:assembleDebug :DemoWalletUITests:assembleDebug
          unzip -p OID4VCWallet/build/outputs/aar/OID4VCWallet-release.aar libs/classes.jar > "$RUNNER_TEMP/go.jar"
          if unzip -l "$RUNNER_TEMP/go.jar" | grep -q TestEnv; then
            echo "::error::the release library carries TestEnv"; exit 1
          fi

      # The library as wallet-kotlin-release.yml publishes it, and an app
      # built on its AAR as the README says.
      - name: lay out the published release
        env:
          SKIP_AAR_BUILD: "1"
        run: mkdir -p "$RUNNER_TEMP/kotlin-pkg" && mobile/android/package-kotlin-release.sh 0.0.0-ci "$RUNNER_TEMP/kotlin-pkg" "$RUNNER_TEMP/kotlin-assets"

  # The library's floor, minSdk 26: its instrumented tests on an API 26
  # emulator, where API 28 and 30 calls must be guarded (lint catches
  # most, this the rest). Holder keys there can't require the holder
  # (that needs API 30), so no lock screen is needed; the unlock is
  # best effort, since API 26 may lack locksettings.
  mobile-android-api26:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/go.mod
          check-latest: true
          cache-dependency-path: mobile/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: build the AAR (test build)
        run: mobile/build-aar.sh -tags mobiletest

      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: instrumented tests (API 26)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: mobile/android
          script: |
            ./unlock-emulator.sh || true
            ./gradlew --console=plain :OID4VCWallet:connectedDebugAndroidTest -Poid4vc.testFramework=true

      - name: the failing instrumented tests
        if: failure()
        run: |
          for f in mobile/android/OID4VCWallet/build/outputs/androidTest-results/connected/debug/*.xml; do
            python3 -c 'import sys, xml.etree.ElementTree as E
          for c in E.parse(sys.argv[1]).iter("testcase"):
              for f in c.findall("failure"): print("::error::%s.%s: %s" % (c.get("classname"), c.get("name"), (f.text or "").splitlines()[0][:400]))' "$f"
          done

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Always the latest Go, deliberately not pinned to go.mod's own
      # minimum via go-version-file — see FAPIgo's ci.yml for the
      # rationale (kept identical here).
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
