# Interop: OID4VCgo's conformance-wallet-vp against the EUDI reference
# Verifier Endpoint (eu-digital-identity-wallet/eudi-srv-verifier-endpoint),
# run from its published image by interop/eudi/run-verifier.sh: SD-JWT
# VC and mdoc presentations must be accepted, with the verifier checking
# their status lists and the SD-JWT VC's Type Metadata, and controls
# (revoked credentials among them) refused. The
# image is pinned by digest and runs here, on a disposable runner with a
# read-only token and no secrets. Pull requests, the daily run and each
# release test the pinned image; the weekly run tests EUDI's newest
# release (latest), to show a break before the pin moves.
#
# And the other way round (the wallet job): the EUDI reference wallet
# library, eudi-lib-jvm-openid4vp-kt, presents to OID4VCgo's
# conformance-verifier, by interop/eudi/run-wallet.sh, from a JVM driver
# (interop/eudi/presentation) whose every dependency is pinned. It runs
# with the pinned image's runs, not the weekly one.
#
# And the EUDI wallet library (eudi-lib-jvm-openid4vci-kt) obtaining
# credentials from OID4VCgo's conformance-issuer (the issuer job), by
# interop/eudi/run-issuer.sh: issued in every way both support and
# verified, and controls refused. Its version is pinned exactly, its
# dependencies locked and checksum-verified, so it also runs with the
# pinned image's runs only. Its last profile runs the issuer as two
# instances sharing a PostgreSQL service container.
#
# And OID4VCgo's wallet against the EUDI reference PID Issuer
# (eudi-srv-pid-issuer, the pid-issuer job), run as its own
# docker-compose stack by interop/eudi/run-pid-issuer.sh: PIDs in both
# formats must be issued and pass the wallet's own checks, and controls
# refused. Its images are pinned by digest too, and the weekly run tests
# the PID Issuer's latest image as well.
#
# The verifier-production and pid-issuer-production jobs run the
# verifier and PID Issuer runs again with OID4VCgo's wallet at
# production assurance (WALLET_ASSURANCE=production): its own cases,
# the wallet in a container on interop/prodnet.sh's network.
name: EUDI interop

on:
  pull_request:
    # The Kotlin and Swift libraries aren't the wallet this runs.
    paths-ignore:
      - 'mobile/**'
  schedule:
    - cron: '45 6 * * *' # daily, 6:45am UTC: the pinned image
    - cron: '15 7 * * 1' # Mondays, 7:15am UTC: EUDI's latest image
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verifier_image:
        description: Verifier image to test (empty for the pinned one)
        default: ''
      pid_issuer_image:
        description: PID Issuer image to test (empty for the pinned one)
        default: ''

permissions:
  contents: read

concurrency:
  group: eudi-interop-${{ github.ref }}-${{ github.event.schedule || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The issued-credential cases build the issuer, the Wallet
      # Provider and the wallet with sqlstore.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: sqlstore/go.sum

      - name: Run the interop script
        env:
          VERIFIER_IMAGE: ${{ inputs.verifier_image || (github.event.schedule == '15 7 * * 1' && 'ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:latest') || '' }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudi-work"
          mkdir -p "$WORK"
          [ -n "$VERIFIER_IMAGE" ] || unset VERIFIER_IMAGE
          bash interop/eudi/run-verifier.sh 2>&1 | tee "$RUNNER_TEMP/eudi-interop.log"

      # The work dir also holds the run's throwaway keys: only the logs
      # and the parties' answers are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-interop
          path: |
            ${{ runner.temp }}/eudi-interop.log
            ${{ runner.temp }}/eudi-work/*.log
            ${{ runner.temp }}/eudi-work/*.txt
            ${{ runner.temp }}/eudi-work/result-*.json
            ${{ runner.temp }}/eudi-work/wallet-provider/*.log
          retention-days: 14

  # The same verifier, presented to by walletflow at production
  # assurance (WALLET_ASSURANCE=production): the wallet in a container
  # on interop/prodnet.sh's network, with its own HTTP client and the
  # run's TLS CA as its system roots.
  verifier-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: sqlstore/go.sum

      - name: Run the interop script
        env:
          VERIFIER_IMAGE: ${{ inputs.verifier_image || (github.event.schedule == '15 7 * * 1' && 'ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:latest') || '' }}
          WALLET_ASSURANCE: production
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudi-work"
          mkdir -p "$WORK"
          [ -n "$VERIFIER_IMAGE" ] || unset VERIFIER_IMAGE
          bash interop/eudi/run-verifier.sh 2>&1 | tee "$RUNNER_TEMP/eudi-interop.log"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-interop-production
          path: |
            ${{ runner.temp }}/eudi-interop.log
            ${{ runner.temp }}/eudi-work/*.log
            ${{ runner.temp }}/eudi-work/*.txt
            ${{ runner.temp }}/eudi-work/result-*.json
            ${{ runner.temp }}/eudi-work/wallet-provider/*.log
          retention-days: 14

  wallet:
    # The weekly run and a dispatch naming an image test a newer EUDI
    # image, which this job doesn't use.
    if: github.event.schedule != '15 7 * * 1' && !inputs.verifier_image && !inputs.pid_issuer_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # The committed gradle-wrapper.jar must be one Gradle published
      # (its checksum among Gradle's), before anything runs it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the interop script
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudi-wallet-work"
          mkdir -p "$WORK"
          bash interop/eudi/run-wallet.sh 2>&1 | tee "$RUNNER_TEMP/eudi-wallet-interop.log"

      # The work dir also holds the run's throwaway keys (the verifiers'
      # and wallet's configs): only the logs and the verifiers' answers
      # are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-wallet-interop
          path: |
            ${{ runner.temp }}/eudi-wallet-interop.log
            ${{ runner.temp }}/eudi-wallet-work/*.log
            ${{ runner.temp }}/eudi-wallet-work/result-*.json
            ${{ runner.temp }}/eudi-wallet-work/wallet-metadata.json
          retention-days: 14

  issuer:
    # The weekly run and a dispatch naming an image test that image,
    # not this pinned library.
    if: github.event.schedule != '15 7 * * 1' && inputs.verifier_image == '' && inputs.pid_issuer_image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The database the production-scaled profile's two issuer instances
    # share (POSTGRES_URL), which run-issuer.sh runs when it's set.
    services:
      postgres:
        # Pinned by digest, as ci.yml's sqlstore job's. Dependabot
        # doesn't update service images: move it by hand.
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          # A throwaway container reachable only from this job: no password.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # The committed gradle-wrapper.jar must be one Gradle published
      # (its checksum among Gradle's), before anything runs it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the interop script
        env:
          POSTGRES_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudi-issuer-work"
          mkdir -p "$WORK"
          bash interop/eudi/run-issuer.sh 2>&1 | tee "$RUNNER_TEMP/eudi-issuer-interop.log"

      # The work dir also holds the run's throwaway keys and configs:
      # only the logs are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-issuer-interop
          path: |
            ${{ runner.temp }}/eudi-issuer-interop.log
            ${{ runner.temp }}/eudi-issuer-work/*.log
            ${{ runner.temp }}/eudi-issuer-work/*wallet-provider/*.log
          retention-days: 14

  pid-issuer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # The runner's own JDK supplies keytool, which builds the issuer's
      # keystore.
      - name: Run the interop script
        env:
          PID_ISSUER_IMAGE: ${{ inputs.pid_issuer_image || (github.event.schedule == '15 7 * * 1' && 'ghcr.io/eu-digital-identity-wallet/eudi-srv-pid-issuer:latest') || '' }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudi-pid-work"
          mkdir -p "$WORK"
          [ -n "$PID_ISSUER_IMAGE" ] || unset PID_ISSUER_IMAGE
          bash interop/eudi/run-pid-issuer.sh 2>&1 | tee "$RUNNER_TEMP/eudi-pid-interop.log"

      # The work dir also holds the run's throwaway keys, and the stack's
      # its keystore and passwords: only the logs (their passwords
      # redacted) and the wallet's results are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-pid-interop
          path: |
            ${{ runner.temp }}/eudi-pid-interop.log
            ${{ runner.temp }}/eudi-pid-work/*.log
            ${{ runner.temp }}/eudi-pid-work/result-*.json
          retention-days: 14

  # The same stack, with the wallet at production assurance
  # (WALLET_ASSURANCE=production): its own cases, in a container on
  # interop/prodnet.sh's network, with sqlstore's stores.
  pid-issuer-production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: sqlstore/go.sum

      - name: Run the interop script
        env:
          PID_ISSUER_IMAGE: ${{ inputs.pid_issuer_image || (github.event.schedule == '15 7 * * 1' && 'ghcr.io/eu-digital-identity-wallet/eudi-srv-pid-issuer:latest') || '' }}
          WALLET_ASSURANCE: production
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudi-pid-work"
          mkdir -p "$WORK"
          [ -n "$PID_ISSUER_IMAGE" ] || unset PID_ISSUER_IMAGE
          bash interop/eudi/run-pid-issuer.sh 2>&1 | tee "$RUNNER_TEMP/eudi-pid-interop.log"

      # As the pid-issuer job's: the logs, their passwords redacted, and
      # the wallet's results, not its stores.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudi-pid-interop-production
          path: |
            ${{ runner.temp }}/eudi-pid-interop.log
            ${{ runner.temp }}/eudi-pid-work/*.log
            ${{ runner.temp }}/eudi-pid-work/result-*.json
          retention-days: 14

  # Report each scheduled (or dispatched) default-branch run on an
  # issue, opened when the run fails and closed when one passes
  # (.github/scripts/scheduled-alert.sh): nothing else alerts on it.
  # A run against another image than the pinned one (the weekly run, or
  # a dispatch naming one) has its own label, so a pinned run passing
  # doesn't close its issue.
  alert:
    needs: [verifier, verifier-production, wallet, issuer, pid-issuer, pid-issuer-production]
    if: always() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/scheduled-alert.yml
    with:
      # A skipped job (the wallet's or issuer's, on the weekly run) doesn't count.
      result: ${{ (contains(needs.*.result, 'failure') && 'failure') || (contains(needs.*.result, 'cancelled') && 'cancelled') || 'success' }}
      label: ${{ (github.event.schedule == '15 7 * * 1' || inputs.verifier_image != '' || inputs.pid_issuer_image != '') && 'interop-eudi-latest' || 'interop-eudi' }}
      title: ${{ (github.event.schedule == '15 7 * * 1' || inputs.verifier_image != '' || inputs.pid_issuer_image != '') && 'EUDI interop failure against a newer EUDI image' || 'Scheduled EUDI interop failure' }}
