# Interop: OID4VCgo's wallet against EUDIPLO's OpenID4VP 1.0 Verifier
# and its OpenID4VCI 1.0 Credential Issuer, from its published image
# pinned by digest, by interop/eudiplo/run.sh (and issuer.sh).
# cmd/conformance-issuer's production setup issues SD-JWT VC and mdoc
# PIDs to walletflow, attested by OID4VCgo's Wallet Provider, which
# presents them to EUDIPLO's signed x509_hash requests, the response
# encrypted (direct_post.jwt), over the Digital Credentials API
# (dc_api.jwt) and, for the mdoc, ISO/IEC TS 18013-7 Annex C; EUDIPLO
# trusts the issuer's CAs through a trust list and checks each
# credential's Token Status List entry. Then controls (credentials the
# issuer revoked, presentations changed on their way to EUDIPLO, an
# Annex C answer for another origin, the wallet's own refusals)
# refused, each by its reason. Then EUDIPLO's issuer issues SD-JWT VC
# and mdoc PIDs to walletflow (pre-authorized code with a tx_code,
# batches, DPoP, encrypted requests and responses, Wallet and Key
# Attestations from a second instance of OID4VCgo's Wallet Provider,
# which EUDIPLO's trust list names and whose status lists it checks),
# the wallet checking each credential's status on EUDIPLO's lists; and
# controls (a wrong tx_code, an untrusted or revoked Wallet Attestation,
# a Key Attestation below the required level, a DPoP proof for another
# htu, an untrusted issuer, a revoked credential), each refused by its
# reason; two known gaps of EUDIPLO's are noted, failing once they
# change. It runs here on a disposable runner with a read-only token
# and no secrets. Pull requests, the daily run and
# each release test the pinned image; the weekly run tests EUDIPLO's
# latest image, to show a break before the pin moves.
name: EUDIPLO interop

on:
  pull_request:
    # The Kotlin and Swift libraries aren't the wallet this runs.
    paths-ignore:
      - 'mobile/**'
  schedule:
    - cron: '15 7 * * *' # daily, 7:15am UTC: the pinned image
    - cron: '45 8 * * 1' # Mondays, 8:45am UTC: EUDIPLO's latest image
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      eudiplo_tag:
        description: EUDIPLO image tag to test (empty for the pinned image)
        default: ''

permissions:
  contents: read

concurrency:
  group: eudiplo-interop-${{ github.ref }}-${{ github.event.schedule || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: Run the interop script
        env:
          EUDIPLO_TAG: ${{ inputs.eudiplo_tag || (github.event.schedule == '45 8 * * 1' && 'latest') || '' }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/eudiplo-work"
          mkdir -p "$WORK"
          [ -n "$EUDIPLO_TAG" ] || unset EUDIPLO_TAG
          bash interop/eudiplo/run.sh 2>&1 | tee "$RUNNER_TEMP/eudiplo-interop.log"

      # The work dir also holds the run's throwaway keys and EUDIPLO's
      # config folder with them: only the logs and the parties' answers
      # are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eudiplo-interop
          path: |
            ${{ runner.temp }}/eudiplo-interop.log
            ${{ runner.temp }}/eudiplo-work/*.log
            ${{ runner.temp }}/eudiplo-work/wallet-provider/*.log
            ${{ runner.temp }}/eudiplo-work/wallet-provider-eudiplo/*.log
            ${{ runner.temp }}/eudiplo-work/*-wallet.json
            ${{ runner.temp }}/eudiplo-work/*-session.json
            ${{ runner.temp }}/eudiplo-work/*-session-log.json
            ${{ runner.temp }}/eudiplo-work/*-post.json
          retention-days: 14

  # Report each scheduled (or dispatched) default-branch run on an
  # issue, opened when the run fails and closed when one passes
  # (.github/scripts/scheduled-alert.sh): nothing else alerts on it.
  alert:
    needs: [interop]
    if: always() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/scheduled-alert.yml
    with:
      result: ${{ needs.interop.result }}
      label: ${{ (github.event.schedule == '45 8 * * 1' || inputs.eudiplo_tag != '') && 'interop-eudiplo-latest' || 'interop-eudiplo' }}
      title: ${{ (github.event.schedule == '45 8 * * 1' || inputs.eudiplo_tag != '') && 'EUDIPLO interop failure against a newer EUDIPLO image' || 'Scheduled EUDIPLO interop failure' }}
