# Interop: OID4VCgo against Credo (credo-ts) as OpenID4VCI 1.0
# Credential Issuer, OpenID4VP 1.0 Verifier and holder, from its
# published npm packages, by interop/credo/run.sh. OID4VCgo's wallet
# gets an SD-JWT VC and an mDL from Credo's issuer by pre-authorized
# code (DPoP, and a Wallet Attestation and Key Attestation from
# OID4VCgo's Wallet Provider), then presents them to Credo's signed
# x509_hash request, the response encrypted. Credo's holder gets SD-JWT
# VC and mdoc PIDs from cmd/conformance-issuer under HAIP (and its
# dpop-nonces, deferred and key-attestation profiles), then presents
# them to cmd/conformance-verifier, on its default engine and through
# verifier.Transactions under production assurance, checking their
# status. Then controls (untrusted issuers, Verifiers and attesters,
# wrong tx_codes, Key Attestations either side must refuse, a revoked
# credential, an unsigned request, presentations changed on their way
# to Credo) refused, each by its reason. The packages are pinned by
# version and lock (interop/credo/driver's
# package-lock.json) and run here on a disposable runner with a
# read-only token and no secrets. Pull requests, the daily run and each
# release test the pinned release; the weekly run tests Credo's newest
# release on npm (latest), without the lock, to show a break before the
# pin moves.
name: Credo interop

on:
  pull_request:
    # The Kotlin and Swift libraries aren't the wallet this runs.
    paths-ignore:
      - 'mobile/**'
  schedule:
    - cron: '0 7 * * *' # daily, 7am UTC: the pinned release
    - cron: '30 8 * * 1' # Mondays, 8:30am UTC: Credo's newest release
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      credo_version:
        description: Credo release to test (X.Y.Z, or latest; empty for the pinned release)
        default: ''

permissions:
  contents: read

concurrency:
  group: credo-interop-${{ github.ref }}-${{ github.event.schedule || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # Credo requires Node 22 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interop/credo/driver/package-lock.json

      - name: Run the interop script
        env:
          CREDO_VERSION: ${{ inputs.credo_version || (github.event.schedule == '30 8 * * 1' && 'latest') || '' }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/credo-work"
          mkdir -p "$WORK"
          [ -n "$CREDO_VERSION" ] || unset CREDO_VERSION
          bash interop/credo/run.sh 2>&1 | tee "$RUNNER_TEMP/credo-interop.log"

      # The work dir also holds the run's throwaway keys: only the logs
      # are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credo-interop
          path: |
            ${{ runner.temp }}/credo-interop.log
            ${{ runner.temp }}/credo-work/*.log
            ${{ runner.temp }}/credo-work/*wallet-provider/*.log
          retention-days: 14

  # Report each scheduled (or dispatched) default-branch run on an
  # issue, opened when the run fails and closed when one passes
  # (.github/scripts/scheduled-alert.sh): nothing else alerts on it.
  alert:
    needs: [interop]
    if: always() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/scheduled-alert.yml
    with:
      result: ${{ needs.interop.result }}
      label: ${{ (github.event.schedule == '30 8 * * 1' || inputs.credo_version != '') && 'interop-credo-latest' || 'interop-credo' }}
      title: ${{ (github.event.schedule == '30 8 * * 1' || inputs.credo_version != '') && 'Credo interop failure against a newer Credo release' || 'Scheduled Credo interop failure' }}
