# Maintains an up-to-date "release PR" (version bump + CHANGELOG.md,
# computed from Conventional Commits messages on main since the last
# release — see CONTRIBUTING.md) on every push to main, and tags +
# publishes a GitHub Release the moment that PR is merged. See
# release-please-config.json / .release-please-manifest.json for the
# actual version/tag configuration.
#
# Uses a personal-access-token secret (RELEASE_PLEASE_TOKEN), not the
# default GITHUB_TOKEN — required so the release PR this action opens
# actually triggers ci.yml on itself; GitHub blocks GITHUB_TOKEN-
# authored events from triggering other workflows, to prevent
# recursion. See CONTRIBUTING.md for what the token needs.
name: release-please

on:
  push:
    branches: [main]

# Read-only by default; the job grants itself what it needs.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GitHub marks the newest release Latest, so a sqlstore release —
      # alone, or created after the library's when both release
      # together — would take it: keep the library's newest release
      # (a vX.Y.Z tag, no component prefix, the highest version, not the
      # most recently created) Latest. releases_created is
      # always set, to "true" or "false", hence the comparison.
      - name: Mark the library's release Latest
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ROOT_RELEASED: ${{ steps.release.outputs.release_created }}
          ROOT_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ "$ROOT_RELEASED" = true ]; then
            tag=$ROOT_TAG
          else
            tag=$(gh release list --exclude-drafts --limit 100 --json tagName,isPrerelease \
              --jq '[.[] | select((.isPrerelease | not) and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
                | sort_by(.tagName | ltrimstr("v") | split(".") | map(tonumber)) | last | .tagName // empty')
          fi
          if [ -z "$tag" ]; then
            echo "No release of the library to mark Latest."
            exit 0
          fi
          gh release edit "$tag" --latest
