# Interop: OID4VCgo against ProtocolSoup (ParleSec/ProtocolSoup), its
# VC service and wallet harness images built from a pinned commit, by
# interop/protocolsoup/run.sh (and issuer.sh, holder.sh), in four
# directions. cmd/conformance-issuer's production setup issues SD-JWT
# VC and mdoc PIDs to walletflow, attested by OID4VCgo's Wallet
# Provider, which presents them to ProtocolSoup's signed x509_hash
# (HAIP mode) and x509_san_dns requests, the response encrypted
# (direct_post.jwt); controls (presentations changed on their way,
# the wallet's own refusals) are refused, each by its reason.
# ProtocolSoup's issuer issues SD-JWT VCs to walletflow (pre-authorized
# code with a tx_code, OID4VCgo's Wallet and Key Attestations, DPoP,
# encrypted requests and responses, a batch, deferred issuance, its
# status list checked), with controls (a wrong tx_code, an untrusted
# attester, an untrusted issuer). ProtocolSoup's wallet harness, driven
# over its HTTP API, receives SD-JWT VCs from OID4VCgo's issuer and
# presents them to cmd/conformance-verifier, with controls on each
# side. Five known gaps are noted, failing once they change. It runs
# here on a disposable runner with a read-only token and no secrets.
# Pull requests, the daily run and each release test the pinned
# commit; the weekly run tests ProtocolSoup's master, to show a break
# before the pin moves.
name: ProtocolSoup interop

on:
  pull_request:
    # The Kotlin and Swift libraries aren't the wallet this runs.
    paths-ignore:
      - 'mobile/**'
  schedule:
    - cron: '30 7 * * *' # daily, 7:30am UTC: the pinned commit
    - cron: '0 9 * * 1' # Mondays, 9am UTC: ProtocolSoup's master
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      protocolsoup_ref:
        description: ProtocolSoup commit, branch or tag to build and test (empty for the pinned commit)
        default: ''

permissions:
  contents: read

concurrency:
  group: protocolsoup-interop-${{ github.ref }}-${{ github.event.schedule || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      # The commit the images are built from: the pin, or the ref
      # asked for, resolved, which keys the image cache.
      - name: Resolve ProtocolSoup's commit
        id: ref
        env:
          REF: ${{ inputs.protocolsoup_ref || (github.event.schedule == '0 9 * * 1' && 'master') || '' }}
        run: |
          set -euo pipefail
          ref="${REF:-$(sed -n 's/^PROTOCOLSOUP_PIN=//p' interop/protocolsoup/run.sh)}"
          [[ "$ref" =~ ^[0-9A-Za-z._/-]+$ ]] || { echo "bad ref: $ref" >&2; exit 1; }
          if [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then sha="$ref"
          else sha="$(git ls-remote https://github.com/ParleSec/ProtocolSoup.git "$ref" "refs/tags/$ref^{}" | tail -1 | cut -f1)"; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "can't resolve $ref" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore ProtocolSoup's images
        id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/protocolsoup-images
          key: protocolsoup-images-${{ steps.ref.outputs.sha }}

      - name: Run the interop script
        env:
          PROTOCOLSOUP_REF: ${{ steps.ref.outputs.sha }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/protocolsoup-work" PROTOCOLSOUP_IMAGE_CACHE="$RUNNER_TEMP/protocolsoup-images"
          mkdir -p "$WORK"
          bash interop/protocolsoup/run.sh 2>&1 | tee "$RUNNER_TEMP/protocolsoup-interop.log"

      - name: Save ProtocolSoup's images
        if: always() && steps.images.outputs.cache-hit != 'true' && hashFiles(format('{0}/protocolsoup-images/images.tar', runner.temp)) != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/protocolsoup-images
          key: protocolsoup-images-${{ steps.ref.outputs.sha }}

      # The work dir also holds the run's throwaway keys: only the logs
      # and the parties' answers are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: protocolsoup-interop
          path: |
            ${{ runner.temp }}/protocolsoup-interop.log
            ${{ runner.temp }}/protocolsoup-work/*.log
            ${{ runner.temp }}/protocolsoup-work/wallet-provider/*.log
            ${{ runner.temp }}/protocolsoup-work/other-wallet-provider/*.log
            ${{ runner.temp }}/protocolsoup-work/*-wallet.json
            ${{ runner.temp }}/protocolsoup-work/*-result.json
            ${{ runner.temp }}/protocolsoup-work/*-import.json
            ${{ runner.temp }}/protocolsoup-work/*-present.json
            ${{ runner.temp }}/protocolsoup-work/*-verdict.json
          retention-days: 14

  # Report each scheduled (or dispatched) default-branch run on an
  # issue, opened when the run fails and closed when one passes
  # (.github/scripts/scheduled-alert.sh): nothing else alerts on it.
  alert:
    needs: [interop]
    if: always() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/scheduled-alert.yml
    with:
      result: ${{ needs.interop.result }}
      label: ${{ (github.event.schedule == '0 9 * * 1' || inputs.protocolsoup_ref != '') && 'interop-protocolsoup-latest' || 'interop-protocolsoup' }}
      title: ${{ (github.event.schedule == '0 9 * * 1' || inputs.protocolsoup_ref != '') && 'ProtocolSoup interop failure against a newer ProtocolSoup commit' || 'Scheduled ProtocolSoup interop failure' }}
