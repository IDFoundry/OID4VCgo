# Runs the OpenSSF Scorecard (https://scorecard.dev) on main: weekly,
# on every push, and when branch protection changes. Results are
# published to the public Scorecard API (behind the README badge) and
# uploaded as code scanning alerts (Security tab). Follows
# ossf/scorecard-action's own template; publish_results requires the
# analysis job's permissions to stay exactly as they are, and its steps
# to use only the actions it allows (wait-for-ci is a job of its own
# for that reason).
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]

# Read-only by default; the job below grants itself exactly what it
# needs.
permissions:
  contents: read

jobs:
  # Binary-Artifacts leaves the committed gradle-wrapper.jars out only
  # when the first workflow that validates them (ci.yml) has succeeded
  # on main's latest commit, which a run started by the same push would
  # otherwise always look before. This waits for that run (CI takes
  # under ten minutes); if it fails, or hasn't finished in 25, the
  # analysis runs anyway and counts the jars, as it should then.
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 50); do
            state=$(gh run list --workflow ci.yml --commit "$SHA" --event push --limit 1 \
              --json status,conclusion --jq '.[0] // empty | "\(.status) \(.conclusion)"' || true)
            echo "ci.yml at $SHA: ${state:-no run yet}"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::warning::CI didn't succeed on $SHA; Binary-Artifacts will count the Gradle wrappers"; exit 0 ;;
              *) ;; # queued, in progress, or no run yet: wait
            esac
            sleep 30
          done
          echo "::warning::CI hadn't finished on $SHA after 25 minutes; Binary-Artifacts will count the Gradle wrappers"

  analysis:
    needs: wait-for-ci
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # publish_results: sign the published results
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
