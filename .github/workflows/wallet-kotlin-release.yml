# Publishes a release of the OID4VCWallet Kotlin library to
# github.com/IDFoundry/OID4VCgo-wallet-kotlin, whose GitHub Pages serve
# it as a Maven repository (dev.idfoundry:oid4vcwallet):
# mobile/android/package-kotlin-release.sh builds the release AAR and
# lays out the repository, then this commits it there and creates the
# release, tagged with the version and carrying the AAR, in one step.
#
# The version is the Swift package's, published from the same commit
# (wallet-swift-release), apart from this module's release-please
# versions. Run it by hand (Actions → wallet-kotlin-release → Run
# workflow) from the commit to publish.
#
# Uses a fine-grained personal access token secret (WALLET_KOTLIN_TOKEN)
# with Contents read and write on OID4VCgo-wallet-kotlin only: the
# default GITHUB_TOKEN can't write to another repository. That
# repository's Pages serve its main branch's root.
name: wallet-kotlin-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release's version — the Swift package's: 1.2.3, no v"
        required: true

permissions:
  contents: read

concurrency:
  group: wallet-kotlin-release

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.WALLET_KOTLIN_TOKEN }}
      REPO: IDFoundry/OID4VCgo-wallet-kotlin
      NDK_VERSION: "30.0.16248370"
    steps:
      - uses: actions/checkout@v7

      - name: check the version is new
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a version: $VERSION"; exit 1; }
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$REPO already has release $VERSION"; exit 1
          fi

      - uses: actions/checkout@v7
        with:
          repository: IDFoundry/OID4VCgo-wallet-kotlin
          token: ${{ secrets.WALLET_KOTLIN_TOKEN }}
          path: wallet-kotlin

      - uses: actions/setup-go@v7
        with:
          go-version-file: mobile/go.mod
          check-latest: true
          cache-dependency-path: mobile/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: build and lay out the repository
        run: mobile/android/package-kotlin-release.sh "$VERSION" wallet-kotlin "$RUNNER_TEMP/assets" | tee "$RUNNER_TEMP/summary.txt"

      - name: commit, tag and release
        working-directory: wallet-kotlin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OID4VCWallet $VERSION from IDFoundry/OID4VCgo@$GITHUB_SHA"
          git push origin HEAD:main
          {
            echo "Built from [IDFoundry/OID4VCgo@${GITHUB_SHA:0:7}](https://github.com/IDFoundry/OID4VCgo/commit/$GITHUB_SHA)."
            echo
            tail -1 "$RUNNER_TEMP/summary.txt"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" "$RUNNER_TEMP/assets/oid4vcwallet-$VERSION.aar" \
            --repo "$REPO" --target "$(git rev-parse HEAD)" --title "OID4VCWallet $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
