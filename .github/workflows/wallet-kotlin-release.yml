# Publishes a release of the OID4VCWallet Kotlin library to
# github.com/IDFoundry/OID4VCgo-wallet-kotlin, as release artifacts:
# mobile/android/package-kotlin-release.sh builds the AAR and its sources
# jar and lays out the repository (the mirrored sources, the README),
# then this commits that there and creates the release, tagged with the
# version and carrying both files, their SHA256SUMS, and a build
# provenance attestation, in one step.
#
# The version is the Swift package's, published from the same commit
# (wallet-swift-release), apart from this module's release-please
# versions. Run it by hand (Actions → wallet-kotlin-release → Run
# workflow) from main.
#
# Uses a fine-grained personal access token secret (WALLET_KOTLIN_TOKEN)
# with Contents read and write on OID4VCgo-wallet-kotlin only: the
# default GITHUB_TOKEN can't write to another repository. The token
# reaches only the steps that publish, never the build, and no checkout
# keeps it. The job runs in the mobile-release environment: give it
# required reviewers and limit it to main in the repository's settings
# (Environments), and keep the token as its secret.
name: wallet-kotlin-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The release's version — the Swift package's: 1.2.3, no v"
        required: true

permissions:
  contents: read

concurrency:
  group: wallet-kotlin-release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mobile-release
    permissions:
      contents: read
      id-token: write # the provenance attestation
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      REPO: IDFoundry/OID4VCgo-wallet-kotlin
      NDK_VERSION: "30.0.16248370"
    steps:
      - name: only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::publish from main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: check the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::not a version: $VERSION"; exit 1; }
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$REPO already has release $VERSION"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: IDFoundry/OID4VCgo-wallet-kotlin
          token: ${{ secrets.WALLET_KOTLIN_TOKEN }}
          persist-credentials: false
          path: wallet-kotlin

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/go.mod
          check-latest: true
          cache-dependency-path: mobile/go.sum

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      - name: build and lay out the repository
        run: mobile/android/package-kotlin-release.sh "$VERSION" wallet-kotlin "$RUNNER_TEMP/assets" | tee "$RUNNER_TEMP/summary.txt"

      - name: checksums
        working-directory: ${{ runner.temp }}/assets
        run: sha256sum "oid4vcwallet-$VERSION.aar" "oid4vcwallet-$VERSION-sources.jar" | tee SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/assets/oid4vcwallet-${{ inputs.version }}.aar
            ${{ runner.temp }}/assets/oid4vcwallet-${{ inputs.version }}-sources.jar

      - name: commit, tag and release
        working-directory: wallet-kotlin
        env:
          GH_TOKEN: ${{ secrets.WALLET_KOTLIN_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "OID4VCWallet $VERSION from IDFoundry/OID4VCgo@$GITHUB_SHA"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD:main
          {
            echo "Built from [IDFoundry/OID4VCgo@${GITHUB_SHA:0:7}](https://github.com/IDFoundry/OID4VCgo/commit/$GITHUB_SHA)."
            echo
            tail -1 "$RUNNER_TEMP/summary.txt"
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS\`, and its provenance with"
            echo "\`gh attestation verify oid4vcwallet-$VERSION.aar --repo IDFoundry/OID4VCgo\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" "$RUNNER_TEMP/assets/oid4vcwallet-$VERSION.aar" "$RUNNER_TEMP/assets/oid4vcwallet-$VERSION-sources.jar" \
            "$RUNNER_TEMP/assets/SHA256SUMS" \
            --repo "$REPO" --target "$(git rev-parse HEAD)" --title "OID4VCWallet $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: check the published files are the ones built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          gh release download "$VERSION" --repo "$REPO"
          sha256sum -c "$RUNNER_TEMP/assets/SHA256SUMS"
