# Interop: OID4VCgo against Multipaz's mdoc reader, holder, verifier
# and wallet, from its published library, by interop/multipaz/run.sh: in
# person (ISO/IEC 18013-5, by whole messages, no radio) and over the
# Digital Credentials API (ISO/IEC TS 18013-7 Annex C), each side in
# each role, with deviceMac as well as device signatures; and OpenID4VP
# 1.0, each side as wallet and Verifier, cross-device and over the DC
# API; and OpenID4VCI 1.0, each side as wallet and issuer; then controls
# (untrusted readers, Verifiers, issuers and attesters, a response over
# another session transcript or for another origin, a mismatched
# x509_hash client_id) refused. The library is pinned by
# version, lock and checksum, and runs here on a disposable runner with
# a read-only token and no secrets. Pull requests, the daily run and
# each release test the pinned release; the weekly run tests Multipaz's
# newest release on Maven Central (latest), without the pin's locks and
# checksums, to show a break before the pin moves.
name: Multipaz interop

on:
  pull_request:
    # The Kotlin and Swift libraries aren't the holder this runs.
    paths-ignore:
      - 'mobile/**'
  schedule:
    - cron: '45 6 * * *' # daily, 6:45am UTC: the pinned release
    - cron: '15 8 * * 1' # Mondays, 8:15am UTC: Multipaz's newest release
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      multipaz_version:
        description: Multipaz release to test (X.Y.Z, or latest; empty for the pinned release)
        default: ''

permissions:
  contents: read

concurrency:
  group: multipaz-interop-${{ github.ref }}-${{ github.event.schedule || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      # The committed gradle-wrapper.jar must be one Gradle published
      # (its checksum among Gradle's), before anything runs it.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run the interop script
        env:
          MULTIPAZ_VERSION: ${{ inputs.multipaz_version || (github.event.schedule == '15 8 * * 1' && 'latest') || '' }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/multipaz-work"
          mkdir -p "$WORK"
          [ -n "$MULTIPAZ_VERSION" ] || unset MULTIPAZ_VERSION
          bash interop/multipaz/run.sh 2>&1 | tee "$RUNNER_TEMP/multipaz-interop.log"

      # The work dir also holds the run's throwaway keys: only the logs
      # are uploaded.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multipaz-interop
          path: |
            ${{ runner.temp }}/multipaz-interop.log
            ${{ runner.temp }}/multipaz-work/*.log
          retention-days: 14

  # Report each scheduled (or dispatched) default-branch run on an
  # issue, opened when the run fails and closed when one passes
  # (.github/scripts/scheduled-alert.sh): nothing else alerts on it.
  alert:
    needs: [interop]
    if: always() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/scheduled-alert.yml
    with:
      result: ${{ needs.interop.result }}
      label: ${{ (github.event.schedule == '15 8 * * 1' || inputs.multipaz_version != '') && 'interop-multipaz-latest' || 'interop-multipaz' }}
      title: ${{ (github.event.schedule == '15 8 * * 1' || inputs.multipaz_version != '') && 'Multipaz interop failure against a newer Multipaz release' || 'Scheduled Multipaz interop failure' }}
