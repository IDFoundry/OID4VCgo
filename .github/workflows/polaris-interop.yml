# Interop: OID4VCgo's conformance-wallet-vp against polaris-oid4vp, an
# independent OpenID4VP 1.0 + HAIP verifier, using polaris-id's own
# script (lab/interop/oid4vcgo/run.sh): the presentation must be
# accepted, and four controls refused (a replay, a mismatched client_id,
# an untrusted issuer CA, an untrusted verifier CA). The verifier runs
# from polaris-id's source, so it runs here, on a disposable runner with
# a read-only token and no secrets, pinned to a reviewed commit. A pull
# request's wallet is built from its own checkout (OID4VCGO_SRC), so a
# regression shows before it's released; the schedule and each release
# test published versions.
name: Polaris interop

on:
  pull_request:
    # The Kotlin and Swift libraries aren't the wallet this runs.
    paths-ignore:
      - 'mobile/**'
  schedule:
    - cron: '30 6 * * *' # daily, 6:30am UTC
  # Each release, as the tag itself: right after tagging, the module
  # proxy's @latest can still be the previous release.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: OID4VCgo release to test (vX.Y.Z, or latest)
        default: latest

permissions:
  contents: read

concurrency:
  group: polaris-interop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EgorKhaklin/polaris-id
          # polaris-oid4vp v1.0.0, reviewed 2026-10-11 (from 84a805f: the
          # verifier unchanged; run.sh gained OID4VCGO_BIN/OID4VCGO_SRC
          # and digest-pinned images). Move it only after reading the
          # change.
          ref: 6f2b890aa56678f090909dd265cf4f113bf04ddc
          path: polaris-id
          persist-credentials: false

      - name: Check out the pull request's wallet
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: oid4vcgo
          persist-credentials: false

      - name: Run the interop script
        working-directory: polaris-id
        env:
          OID4VCGO_VERSION: ${{ github.event.release.tag_name || inputs.version || 'latest' }}
          OID4VCGO_SRC: ${{ github.event_name == 'pull_request' && format('{0}/oid4vcgo', github.workspace) || '' }}
        run: |
          export WORK="$RUNNER_TEMP/polaris-work"
          mkdir -p "$WORK"
          bash lab/interop/oid4vcgo/run.sh 2>&1 | tee "$RUNNER_TEMP/polaris-interop.log"

      - name: Upload the log and the run's files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: polaris-interop
          path: |
            ${{ runner.temp }}/polaris-interop.log
            ${{ runner.temp }}/polaris-work/*.log
            ${{ runner.temp }}/polaris-work/*.html
          retention-days: 14

  # Report each scheduled (or dispatched) default-branch run on an
  # issue labelled "interop-polaris", opened when the run fails and
  # closed when one passes (.github/scripts/scheduled-alert.sh):
  # nothing else alerts on it.
  alert:
    needs: interop
    if: always() && github.ref_name == github.event.repository.default_branch && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/scheduled-alert.yml
    with:
      result: ${{ needs.interop.result }}
      label: interop-polaris
      title: Nightly Polaris interop failure
