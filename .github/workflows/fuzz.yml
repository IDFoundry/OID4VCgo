            pkg: ./proximity/nfcapdu
            name: FuzzHolderStaticHandover
          # Other modules: pkg is relative to module's directory.
          - id: androidattest-parse-key-description
            module: examples/passport-vdc
            pkg: ./internal/androidattest
            name: FuzzParseKeyDescription
          - id: mobile-new-wallet-config
            module: mobile
            pkg: .
            name: FuzzNewWalletConfig
          - id: mobile-new-proximity-reader-config
            module: mobile
            pkg: .
            name: FuzzNewProximityReaderConfig
          - id: mobile-stored-records
            module: mobile
            pkg: .
            name: FuzzStoredRecords
          - id: mobile-proximity-holder
            module: mobile
            pkg: .
            name: FuzzProximityHolder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.target.module && format('{0}/go.mod', matrix.target.module) || 'go.mod' }}
          check-latest: true
          cache-dependency-path: ${{ matrix.target.module && format('{0}/go.sum', matrix.target.module) || 'go.mod' }}

      # Go keeps each target's generated corpus (every input that found
      # new coverage) under $GOCACHE/fuzz/<import path>/<FuzzName>.
      # Carrying it between runs lets coverage build up day to day
      # instead of every run restarting from the seed corpus. Cache
      # entries are immutable, so each run saves under a fresh
      # run-id-suffixed key and the next restores the newest by prefix;
      # old entries age out under GitHub's own cache eviction. The key
      # includes a hash of the package's *_fuzz_test.go files so a
      # changed fuzz function signature starts from scratch rather than
      # tripping over corpus entries of the old shape. setup-go's own
      # GOCACHE cache also contains a fuzz directory, but keyed only on
      # go.mod it never updates — this restore replaces it. src is the
      # package's directory from the repository root, for hashFiles
      # (which always resolves from there): ./<pkg> in the root module,
      # as before, and ./<module>/<pkg> in another.
      - name: Locate fuzz corpus cache
        id: corpus
        env:
          MODULE: ${{ matrix.target.module }}
          PKG: ${{ matrix.target.pkg }}
          NAME: ${{ matrix.target.name }}
        run: |
          echo "dir=$(go env GOCACHE)/fuzz/$(go list "$PKG")/$NAME" >> "$GITHUB_OUTPUT"
          rel=${PKG#./}
          [ "$rel" != . ] || rel=
          src=./${MODULE:+$MODULE/}$rel
          echo "src=${src%/}" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target.id }}-${{ hashFiles(format('{0}/*_fuzz_test.go', steps.corpus.outputs.src)) }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target.id }}-${{ hashFiles(format('{0}/*_fuzz_test.go', steps.corpus.outputs.src)) }}-

      - name: go test -fuzz=${{ matrix.target.name }}
        # -fuzzminimizetime caps how long each newly interesting input
        # is minimized before fuzzing resumes (default 60s). A run with
        # little or no restored corpus finds new inputs constantly
        # early on, and at the default the job spends much of its 5
        # minutes minimizing rather than fuzzing.
        #
        # A "context deadline exceeded" failure with no failing input
        # written is Go's fuzzing engine tripping over its own -fuzztime
        # deadline (typically mid-minimization), not a finding: every
        # real failure writes its input under testdata/fuzz and says so.
        # That case is downgraded to a warning; anything else fails.
        #
        # go test sets no timeout of its own when fuzzing (-timeout is
        # ignored with -fuzz), so a stalled run would sit until the job's
        # timeout-minutes cancels it, and a cancelled job keeps no log.
        # timeout(1) stops it after 8 minutes (5m fuzzing plus margin)
        # with SIGQUIT, which makes the test binary print every
        # goroutine's stack (or SIGKILL a minute later if it doesn't
        # exit), and the step then fails with the log kept.
        run: |
          set +e
          timeout --signal=QUIT --kill-after=1m 8m \
            go test ${{ matrix.target.pkg }} -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=5m -fuzzminimizetime=10s 2>&1 | tee "$RUNNER_TEMP/fuzz.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::${{ matrix.target.name }} was still running after 8 minutes (-fuzztime is 5m) and was stopped; the goroutine dump above shows where it was"
            exit 1
          fi
          if [ "$status" -ne 0 ] \
            && grep -q 'context deadline exceeded' "$RUNNER_TEMP/fuzz.log" \
            && ! grep -q 'Failing input written to' "$RUNNER_TEMP/fuzz.log"; then
            echo "::warning::${{ matrix.target.name }} hit the fuzz engine's own deadline error with no failing input; treating as a pass"
            exit 0
          fi
          exit "$status"

      # always(): a run that finds a failure still grew the corpus up to
      # that point, and a failing input itself lands in testdata/fuzz,
      # not here, so saving never persists the crasher into the cache.
      - name: Save fuzz corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-${{ matrix.target.id }}-${{ hashFiles(format('{0}/*_fuzz_test.go', steps.corpus.outputs.src)) }}-${{ github.run_id }}

      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-${{ matrix.target.id }}
          path: '**/testdata/fuzz/${{ matrix.target.name }}/'
          retention-days: 30

