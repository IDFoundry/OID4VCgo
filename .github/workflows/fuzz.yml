          - id: sdjwtvc-parse-disclosure
            pkg: ./credential/sdjwtvc
            name: FuzzParseDisclosure
          - id: sdjwtvc-verify-signed
            pkg: ./credential/sdjwtvc
            name: FuzzVerifySigned
          - id: statuslist-verify-token
            pkg: ./statuslist
            name: FuzzVerifyToken
          - id: statuslist-verify-token-cwt
            pkg: ./statuslist
            name: FuzzVerifyTokenCWT
          - id: statuslist-check-signed
            pkg: ./statuslist
            name: FuzzCheckSigned
          - id: dcql-query
            pkg: ./dcql
            name: FuzzQuery
          - id: dcql-match
            pkg: ./dcql
            name: FuzzMatch
          - id: registration-verify
            pkg: ./registration
            name: FuzzVerifyRegistration
          - id: registration-verify-signed
            pkg: ./registration
            name: FuzzVerifyRegistrationSigned
          - id: verifier-parse-direct-post-jwt-response
            pkg: ./verifier
