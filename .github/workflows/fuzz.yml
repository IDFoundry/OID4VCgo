          - id: oid4vci-authorization-detail-rar
            pkg: .
            name: FuzzAuthorizationDetailRARDefinition
          - id: verifier-transaction-codec-unmarshal
            pkg: ./verifier
            name: FuzzTransactionCodecUnmarshal
          - id: verifier-status-reference
            pkg: ./verifier
            name: FuzzStatusReference
          - id: verifier-unrequested-sdjwtvc-claims
            pkg: ./verifier
            name: FuzzVerifyResponseUnrequestedSDJWTVCClaims
          - id: verifier-unrequested-mdoc-elements
            pkg: ./verifier
            name: FuzzVerifyResponseUnrequestedMdocElements
          - id: issuer-pre-authorized-refusal-keeps-code
            pkg: ./issuer
            name: FuzzPreAuthorizedCodeRefusalKeepsCode
          - id: proximity-device-request-disclosure
            pkg: ./proximity
            name: FuzzDeviceRequestDisclosure
