name: Fuzz

# Runs this repo's Go native fuzz targets (FuzzXxx functions, alongside
# their package's own _test.go files) with actual mutation-based fuzzing
# (`go test -fuzz=...`), not just their seed corpus — a plain `go test`
# run (ci.yml's own test step) only ever exercises the seed corpus and
# any already-committed regression entries under testdata/fuzz/, so this
# is what actually looks for new crashing/misbehaving inputs. Deliberately
# not triggered on push/pull_request: each target needs real wall-clock
# time to be worth anything, which would slow down every PR's feedback
# loop for a check that isn't about that diff specifically. Scheduled
# instead, daily, plus available on demand. Mirrors FAPIgo's own
# .github/workflows/fuzz.yml in structure and intent.
#
# Informational only: nothing in branch protection depends on this
# workflow, since it never runs against a PR. A found failure fails the
# job and uploads the failing input as a build artifact (go test -fuzz
# writes it under testdata/fuzz/<FuzzName>/ itself) for a human to pull
# down, inspect, and — once satisfied it's a real bug fixed or worth
# tracking — commit into the repo as a permanent regression corpus
# entry; this workflow never commits back on its own.

on:
  schedule:
    - cron: '0 7 * * *' # daily, 7am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          # id is a short, artifact-name-safe identifier — FuzzDecodeUnverified
          # names both internal/jose's and internal/cose's own target,
          # so name alone can't be used as the upload-artifact name below.
          - id: jose-decode-unverified
            pkg: ./internal/jose
            name: FuzzDecodeUnverified
          - id: jwk-parse-public-key
            pkg: ./internal/jwk
            name: FuzzParsePublicKey
          - id: jwe-decrypt
            pkg: ./internal/jwe
            name: FuzzDecrypt
          - id: jwe-decode-header
            pkg: ./internal/jwe
            name: FuzzDecodeHeader
          - id: dpop-verify
            pkg: ./internal/dpop
            name: FuzzVerifyDPoPProof
          - id: cose-decode-unverified
            pkg: ./internal/cose
            name: FuzzDecodeUnverified
          - id: cose-verify-detached
            pkg: ./internal/cose
            name: FuzzVerifyDetached
          - id: cose-decode-unverified-tagged
            pkg: ./internal/cose
            name: FuzzDecodeUnverifiedTagged
          - id: cose-verify-mac
            pkg: ./internal/cose
            name: FuzzVerifyMAC
          - id: mdoc-unmarshal-issuer-signed
            pkg: ./credential/mdoc
            name: FuzzUnmarshalIssuerSigned
          - id: mdoc-unmarshal-device-signed
            pkg: ./credential/mdoc
            name: FuzzUnmarshalDeviceSigned
          - id: oid4vpmdoc-unmarshal-device-response
            pkg: ./oid4vpmdoc
            name: FuzzUnmarshalDeviceResponse
          - id: sdjwtvc-parse
            pkg: ./credential/sdjwtvc
            name: FuzzParse
          - id: sdjwtvc-parse-disclosure
            pkg: ./credential/sdjwtvc
            name: FuzzParseDisclosure
          - id: statuslist-verify-token
            pkg: ./statuslist
            name: FuzzVerifyToken
          - id: statuslist-verify-token-cwt
            pkg: ./statuslist
            name: FuzzVerifyTokenCWT
          - id: dcql-query
            pkg: ./dcql
            name: FuzzQuery
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.mod

      - name: go test -fuzz=${{ matrix.target.name }}
        run: go test ${{ matrix.target.pkg }} -run='^$' -fuzz='^${{ matrix.target.name }}$' -fuzztime=5m

      - name: Upload failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failure-${{ matrix.target.id }}
          path: '**/testdata/fuzz/${{ matrix.target.name }}/'
          retention-days: 30
