sonar.organization=idfoundry
sonar.projectKey=IDFoundry_OID4VCgo

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
# Without this, Sonar's Go sensor scans _test.go files as ordinary
# source needing coverage — since go test's own coverage.out never
# contains an entry for a test file itself (only the code it
# exercises), every test file then scores a guaranteed 0%, inflating
# the coverage denominator by roughly the size of this repo's own test
# suite. Mirrors FAPIgo's own identical fix (see its sonar-project.properties).
sonar.exclusions=**/*_test.go,issuer/issuertest/**,verifier/verifiertest/**,walletflow/walletflowtest/**
# walletflow/walletflowtest is likewise test code under a
# non-_test.go name: an in-process HAIP issuer and Verifier that the
# walletflow and mobile tests drive.
# issuer/issuertest and verifier/verifiertest are each a reusable
# contract test (see their own doc comments) that can't be named
# _test.go because Go doesn't allow importing another package's
# _test.go files — test code in every sense except the filename.

# Populated by ci.yml's `test` job (go test -race -coverprofile=coverage.out
# ./...) before the SonarQube scan step runs — the native Go cover-profile
# format, no conversion needed.
sonar.go.coverage.reportPaths=coverage.out

# Populated by a second `go test -race ./... -json` run in the same job
# — test pass/fail/skip counts and duration, a separate signal from
# coverage.
sonar.go.tests.reportPaths=report.json

# cmd/conformance-wallet is unit-test-free by design (see AGENTS.md) —
# an outbound-driving CLI tool, not a server; its own verification is
# the live suite run itself, matching FAPIgo's own cmd/conformance-client.
#
# conformance/**/*.go (generate-config/run-fapi2sp-battery/run-modules
# etc.) is local dev/CI tooling that drives the OIDF conformance suite
# (see conformance/README.md) — verified by actually running it
# against a live suite, not unit tests; none of it has a _test.go
# counterpart, deliberately.
#
# internal/conformancesuite, internal/conformanceconfig and
# internal/conformanceverifier are the same story: shared dev/CI
# tooling driving or configuring the conformance suite, with no
# _test.go counterpart of their own.
#
# cmd/conformance-issuer/main.go, cmd/conformance-verifier/main.go and
# cmd/conformance-wallet-vp/main.go specifically (not the rest of each
# package — config.go/router.go/wiring.go/handlers.go etc. keep real
# unit coverage and stay gated): each func main() itself calls
# flag.Parse(), log.Fatal (os.Exit) on every validation failure, and
# blocks forever on ListenAndServeTLS, none of which a unit test can
# drive — everything about each binary's own decision logic that *can*
# be extracted into a testable function already has been; what's left
# is the entrypoint glue itself.
# examples/** is a separate Go module with its own CI job (ci.yml's
# "examples"): the root coverage.out never includes it, and its
# real-passport path can't run in CI until a synthetic test passport
# exists, so it's analyzed for issues but not coverage-gated.
# mobile/** is likewise a separate Go module, with its own CI jobs
# (ci.yml's "mobile" and "mobile-ios", the latter running the Swift
# package's tests against the built XCFramework), outside coverage.out.
sonar.coverage.exclusions=examples/**,mobile/**,cmd/conformance-wallet/**/*.go,conformance/**/*.go,internal/conformancesuite/**/*.go,internal/conformanceconfig/**/*.go,internal/conformanceverifier/**/*.go,cmd/conformance-issuer/main.go,cmd/conformance-verifier/main.go,cmd/conformance-wallet-vp/main.go

# Cognitive complexity (go:S3776) isn't flagged in tests: table-driven
# and end-to-end tests read best as one step after another, and
# splitting them into helpers to satisfy the threshold would make each
# harder to follow. Test files are still analyzed as tests for every
# other rule.
sonar.issue.ignore.multicriteria=testcomplexity,swiftparams,swifttesturis,swiftexampleuri,gointerfacenames,swiftapiparams
sonar.issue.ignore.multicriteria.testcomplexity.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.testcomplexity.resourceKey=**/*_test.go

# Unused parameters (swift:S1172) in Swift are protocol requirements:
# CoreBluetooth's delegate methods, KeyStore and the other protocols
# the Swift package and its demos conform to take parameters a given
# implementation doesn't need, and their signatures aren't ours to
# change.
sonar.issue.ignore.multicriteria.swiftparams.ruleKey=swift:S1172
sonar.issue.ignore.multicriteria.swiftparams.resourceKey=**/*.swift

# Hard-coded URIs (swift:S1075) in tests are the fixtures under test,
# and in mobile/ios/ReadmeExample.swift the README's example values.
sonar.issue.ignore.multicriteria.swifttesturis.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.swifttesturis.resourceKey=mobile/ios/**/*Tests/**/*.swift
sonar.issue.ignore.multicriteria.swiftexampleuri.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.swiftexampleuri.resourceKey=mobile/ios/ReadmeExample.swift

# Single-method interface names (godre:S8196, the "-er" convention):
# the flagged ones (ClientAttestationSource, VerifierTrust,
# StoreAssurance, KeySourceAssurance, ...) are exported API, named for
# what they are, and match FAPIgo's own names; renaming them would
# break every caller.
sonar.issue.ignore.multicriteria.gointerfacenames.ruleKey=godre:S8196
sonar.issue.ignore.multicriteria.gointerfacenames.resourceKey=**/*.go

# Parameter count (swift:S107) on the public WalletConfiguration
# initializer: its parameters are the configuration itself, each
# labelled and defaulted, which is Swift's idiom for it.
sonar.issue.ignore.multicriteria.swiftapiparams.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.swiftapiparams.resourceKey=mobile/ios/OID4VCWallet/Sources/OID4VCWallet/Wallet.swift
